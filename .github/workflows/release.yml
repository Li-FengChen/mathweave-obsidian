name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Check tag and application version
        run: |
          $version = python -c "from core.resources import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION ($version)."
          }
      - name: Build and verify Windows package
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/MathWeave-*.zip
            release/SHA256-*.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/MathWeave-$version-Windows-x64.zip" \
            "release/MathWeave-$version-source.zip" \
            "release/SHA256-$version.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "MathWeave $GITHUB_REF_NAME" --generate-notes
